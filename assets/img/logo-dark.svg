<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 112" width="235" height="60">
  <defs>
    <linearGradient id="topL" gradientUnits="userSpaceOnUse" x1="32" y1="6" x2="54" y2="56">
      <stop offset="0" stop-color="#0D6EFD"/>
      <stop offset="0.55" stop-color="#064799"/>
      <stop offset="1" stop-color="#032B66"/>
    </linearGradient>
    <linearGradient id="topR" gradientUnits="userSpaceOnUse" x1="54" y1="6" x2="76" y2="56">
      <stop offset="0" stop-color="#2998F2"/>
      <stop offset="0.6" stop-color="#0B65C6"/>
      <stop offset="1" stop-color="#053B82"/>
    </linearGradient>
    <linearGradient id="blUpper" gradientUnits="userSpaceOnUse" x1="6" y1="44" x2="54" y2="85">
      <stop offset="0" stop-color="#24E5FF"/>
      <stop offset="0.55" stop-color="#06B6E0"/>
      <stop offset="1" stop-color="#008BB8"/>
    </linearGradient>
    <linearGradient id="blLower" gradientUnits="userSpaceOnUse" x1="15" y1="64" x2="54" y2="96">
      <stop offset="0" stop-color="#00A8D6"/>
      <stop offset="1" stop-color="#0A6C96"/>
    </linearGradient>
    <linearGradient id="brUpper" gradientUnits="userSpaceOnUse" x1="54" y1="44" x2="102" y2="92">
      <stop offset="0" stop-color="#2998F2"/>
      <stop offset="1" stop-color="#0D68C9"/>
    </linearGradient>
    <linearGradient id="brLower" gradientUnits="userSpaceOnUse" x1="54" y1="64" x2="93" y2="96">
      <stop offset="0" stop-color="#0A52A6"/>
      <stop offset="1" stop-color="#032B66"/>
    </linearGradient>
  </defs>
  <!-- The Trinity of Care Emblem (Triquetra + 3 Healing Droplets + Central Shield & Star) -->
  <g transform="translate(6, 4)">
    <!-- 1. Bottom-Left Rounded Healing Droplet (Split along diagonal axis from 15,92 to 54,64) -->
    <!-- Upper-Left Cyan Facet -->
    <path d="M 35,44 C 16,44 4,60 7,79 C 8,85 11,89 15,92 L 54,64 L 35,44 Z" fill="url(#blUpper)"/>
    <!-- Lower-Right Teal-Cyan Facet -->
    <path d="M 15,92 C 25,99 42,97 54,87 L 54,64 L 15,92 Z" fill="url(#blLower)"/>

    <!-- 2. Bottom-Right Rounded Healing Droplet (Split along diagonal axis from 93,92 to 54,64) -->
    <!-- Upper-Right Azure Facet -->
    <path d="M 73,44 C 92,44 104,60 101,79 C 100,85 97,89 93,92 L 54,64 L 73,44 Z" fill="url(#brUpper)"/>
    <!-- Lower-Left Deep Royal Facet -->
    <path d="M 93,92 C 83,99 66,97 54,87 L 54,64 L 93,92 Z" fill="url(#brLower)"/>

    <!-- 3. Top Pointed-Apex Healing Droplet (Split down vertical axis x=54) -->
    <!-- Left Cobalt Facet -->
    <path d="M 54,6 C 36,16 29,34 35,50 L 54,56 L 54,6 Z" fill="url(#topL)"/>
    <!-- Right Sapphire Facet -->
    <path d="M 54,6 C 72,16 79,34 73,50 L 54,56 L 54,6 Z" fill="url(#topR)"/>

    <!-- 4. Central White Triquetra Shield (Scalloped Crown Top, Pointed Base at 54,87) -->
    <path d="M 54,41 C 59,47 66,50 73,50 C 69,65 62,77 54,87 C 46,77 39,65 35,50 C 42,50 49,47 54,41 Z" fill="#FFFFFF"/>
    <!-- Subtle inner aqua contour arc on lower-left shield edge -->
    <path d="M 41.5,67 C 45,75 49,81 54,87 C 47,78 43,72 41.5,67 Z" fill="#46D2EE" opacity="0.55"/>

    <!-- 5. 4-Pointed Healing Star Inside Shield -->
    <path d="M 54,48 C 55.3,55.2 56.8,56.7 64,58 C 56.8,59.3 55.3,60.8 54,68 C 52.7,60.8 51.2,59.3 44,58 C 51.2,56.7 52.7,55.2 54,48 Z" fill="#084B9E"/>
  </g>
  <!-- Typography: Zohran / Health Group / Better Health. Brighter Tomorrows. -->
  <g transform="translate(122, 10)">
    <text x="0" y="40" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="40" font-weight="800" fill="#072B66" letter-spacing="-0.4px">Zohran</text>
    <text x="0" y="69" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="25" font-weight="500" fill="#1B8CE0" letter-spacing="-0.2px">Health Group</text>
    <text x="1" y="88" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.2" font-weight="500" fill="#4B6B8A" letter-spacing="0.1px">Better Health. Brighter Tomorrows.</text>
  </g>
</svg>
