<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="220" height="52">
  <defs>
    <linearGradient id="emblem_grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="emblem_grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="subtle_shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Medical Cross / Shield Emblem -->
  <g transform="translate(10, 8)" filter="url(#subtle_shadow)">
    <!-- Outer Shield / Circle Base -->
    <rect x="0" y="0" width="94" height="94" rx="24" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="2"/>
    
    <!-- Central Cross & Heart Geometry -->
    <g transform="translate(47, 47)">
      <!-- Top petal / leaf -->
      <path d="M 0,-34 C 14,-34 22,-20 18,-6 C 14,0 0,0 0,0 C 0,0 -14,0 -18,-6 C -22,-20 -14,-34 0,-34 Z" fill="url(#emblem_grad1)"/>
      <!-- Right petal -->
      <path d="M 34,0 C 34,14 20,22 6,18 C 0,14 0,0 0,0 C 0,0 0,-14 6,-18 C 20,-22 34,-14 34,0 Z" fill="url(#emblem_grad2)"/>
      <!-- Bottom petal -->
      <path d="M 0,34 C -14,34 -22,20 -18,6 C -14,0 0,0 0,0 C 0,0 14,0 18,6 C 22,20 14,34 0,34 Z" fill="url(#emblem_grad1)"/>
      <!-- Left petal -->
      <path d="M -34,0 C -34,-14 -20,-22 -6,-18 C 0,-14 0,0 0,0 C 0,0 0,14 -6,18 C -20,22 -34,14 -34,0 Z" fill="url(#emblem_grad2)"/>
      <!-- Center Star of Health -->
      <circle cx="0" cy="0" r="7" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(122, 12)">
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#0F2744" letter-spacing="-0.5px">ZOHRAN</text>
    <text x="0" y="68" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="14" font-weight="700" fill="#0284C7" letter-spacing="3.2px">HEALTH GROUP</text>
    <text x="0" y="86" font-family="'Inter', sans-serif" font-size="9.5" font-weight="600" fill="#64748B" letter-spacing="0.8px">PATIENT-CENTRED MEDICAL NETWORK • USA &amp; CANADA</text>
  </g>
</svg>
